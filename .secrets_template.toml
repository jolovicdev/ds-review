# DS-Review secrets — copy to .secrets.toml and fill in your values.
# .secrets.toml is gitignored — never commit real secrets.

[deepseek]
# REQUIRED for every deployment you operate.
# DS-Review is BYOK: do not share your key with other repositories/users.
api_key = "sk-your-key-here"

[github]
# "user" for GitHub Actions / PAT, "app" for GitHub App webhook server
# Auto-detected: "user" when GITHUB_ACTIONS=true, else "app"
deployment_type = "app"

# --- Path A: user mode (GitHub Actions / PAT) ---
# Auto-provided in GitHub Actions. For local testing, create a fine-grained PAT
# at https://github.com/settings/tokens?type=beta
# Scopes: Pull Requests (R+W), Contents (R), Metadata (R)
token = ""

# --- Path B: app mode (GitHub App webhook server) ---
# Create a GitHub App at https://github.com/settings/apps/new
# Permissions: Contents (R), Pull requests (R+W), Issues (R+W), Metadata (R).
# Add Checks (R+W) only if check_runs_enabled = true.
# Subscribe to: Pull request, Issue comment, Pull request review comment
app_id = 123456
webhook_secret = "make-up-a-random-string"
# Paste the full PEM private key block inline (same as PR-Agent)
private_key = """
-----BEGIN RSA PRIVATE KEY-----
...
-----END RSA PRIVATE KEY-----"""

# Webhook server (app mode only)
smee_proxy_url = "https://smee.io/your-channel"

# Optional: allow more GitHub author associations to trigger comment-based reviews.
# Defaults to OWNER, MEMBER, COLLABORATOR. Add CONTRIBUTOR only if you accept the model-cost tradeoff.
# DS_REVIEW_MENTION_AUTHOR_ASSOCIATIONS="OWNER,MEMBER,COLLABORATOR,CONTRIBUTOR"
